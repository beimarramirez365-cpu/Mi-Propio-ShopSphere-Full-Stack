
name: CI CD ShopSphere

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: copiar codigo
        uses: actions/checkout@v4

      - name: ejecutando test
        run: |
          docker run --rm \
            -e DB_URL=jdbc:h2:mem:testdb \
            -e DB_USER=sa \
            -e DB_PASSWORD= \
            -e SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver \
            -e SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.H2Dialect \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop \
            -e SPRING_SQL_INIT_MODE=never \
            -v "$PWD/Ecommerce-Backend:/app" \
            -w /app \
            maven:3.9-eclipse-temurin-21 \
            mvn test

  build:
    needs: test
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Copiar codigo
        uses: actions/checkout@v4

      - name: Construyendo imagenes
        run: |
          docker compose build --no-cache

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Copiar codigo
        uses: actions/checkout@v4

      - name: Construyendo contenedores
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          docker compose up -d --build
          docker compose ps
