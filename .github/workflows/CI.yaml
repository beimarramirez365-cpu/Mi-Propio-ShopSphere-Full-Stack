
name: CI CD ShopSphere

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: shopsphere-deploy
  cancel-in-progress: false

jobs:

  test:
    name: Test del Backend
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Copiar codigo
        uses: actions/checkout@v4
        with:
          path: test-src

      - name: Ejecutando test
        run: |
          cd test-src

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e DB_URL=jdbc:h2:mem:testdb \
            -e DB_USER=sa \
            -e DB_PASSWORD= \
            -e SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver \
            -e SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.H2Dialect \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop \
            -e SPRING_SQL_INIT_MODE=never \
            -v "$PWD/Ecommerce-Backend:/app" \
            -w /app \
            maven:3.9-eclipse-temurin-21 \
            mvn -Dmaven.repo.local=/tmp/m2 test

  build:
    name: Build de Docker
    needs: test
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Copiar codigo
        uses: actions/checkout@v4
        with:
          path: build-src

      - name: Construyendo imagenes
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cd build-src

          docker compose -f Docker-Compose.yaml \
            -p shopsphere-full-stack-e-commerce-platform \
            build --no-cache


  deploy:
    name: Deploy de ShopSphere
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Copiar codigo
        uses: actions/checkout@v4
        with:
          path: deploy-src

      - name: Desplegando contenedores
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cd deploy-src

          docker compose -f Docker-Compose.yaml \
            -p shopsphere-full-stack-e-commerce-platform \
            up -d --no-build

          docker compose -f Docker-Compose.yaml \
            -p shopsphere-full-stack-e-commerce-platform \
            ps
