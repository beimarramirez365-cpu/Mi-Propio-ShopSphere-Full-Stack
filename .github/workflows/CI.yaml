
name: CI CD ShopSphere

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Copiar codigo
        uses: actions/checkout@v4

      - name: Ejecutando test
        run: |
          docker run --rm \
            -v "$PWD/Ecommerce-Backend:/app" \
            -w /app \
            maven:3.9-eclipse-temurin-21 \
            mvn test

  build:
    needs: test
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Copiar codigo
        uses: actions/checkout@v4

      - name: Construyendo imagenes
        run: |
          docker compose build --no-cache

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Copiar codigo
        uses: actions/checkout@v4

      - name: Construyendo contenedores
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          docker compose up -d --build
          docker compose ps
